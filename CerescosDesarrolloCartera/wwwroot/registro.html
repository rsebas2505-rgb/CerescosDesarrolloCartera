<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Registrarse - Cerescos</title>

        <link rel="stylesheet" href="css/registro.css" />
    </head>

    <body>
        <div class="contenedor">
            <a href="login.html" class="logo" title="Volver al inicio de sesión">
                <img src="img/logo-cerescos.png" alt="Cerescos" />
            </a>

            <div class="titulo">
                <h2>Crear una cuenta</h2>
                <p>Regístrate para gestionar tus solicitudes</p>
            </div>

            <form id="formRegistro">
                <!-- NOMBRE Y APELLIDO -->
                <div class="fila">
                    <div class="campo">
                        <label for="nombre">Nombre</label>

                        <input type="text" id="nombre" placeholder="Ingrese su nombre" required />
                    </div>

                    <div class="campo">
                        <label for="apellido">Apellido</label>

                        <input
                            type="text"
                            id="apellido"
                            placeholder="Ingrese su apellido"
                            required
                        />
                    </div>
                </div>

                <!-- CORREO -->
                <div class="campo">
                    <label for="correo"> Correo corporativo </label>

                    <input type="email" id="correo" placeholder="usuario@cerescos.com" required />
                </div>

                <!-- USUARIO -->
                <div class="campo">
                    <label for="usuario"> Usuario </label>

                    <input type="text" id="usuario" placeholder="Ingrese un usuario" required />
                </div>

                <!-- CONTRASEÑA -->
                <div class="campo">
                    <label for="password"> Contraseña </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese una contraseña"
                        required
                    />
                </div>

                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="campo">
                    <label for="confirmarPassword"> Confirmar contraseña </label>

                    <input
                        type="password"
                        id="confirmarPassword"
                        placeholder="Repita la contraseña"
                        required
                    />
                </div>

                <!-- BOTÓN -->
                <button type="submit" class="boton"> REGISTRARSE </button>
            </form>

            <!-- MENSAJE -->
            <div id="mensaje" class="mensaje"> </div>

            <!-- LOGIN -->
            <div class="enlace">
                ¿Ya tienes una cuenta?

                <a href="login.html"> Iniciar sesión </a>
            </div>
        </div>

        <script>
            // ==========================================
            // ELEMENTOS DEL FORMULARIO
            // ==========================================

            const formulario = document.getElementById("formRegistro");

            const mensaje = document.getElementById("mensaje");

            // ==========================================
            // EVENTO REGISTRAR
            // ==========================================

            formulario.addEventListener("submit", async function (e) {
                e.preventDefault();

                // Limpiar mensaje anterior

                mensaje.className = "mensaje";

                mensaje.textContent = "";

                // ==========================================
                // OBTENER DATOS
                // ==========================================

                const nombre = document.getElementById("nombre").value.trim();

                const apellido = document.getElementById("apellido").value.trim();

                const correo = document.getElementById("correo").value.trim();

                const usuario = document.getElementById("usuario").value.trim();

                const password = document.getElementById("password").value;

                const confirmarPassword = document.getElementById("confirmarPassword").value;

                // ==========================================
                // VALIDAR CONTRASEÑAS
                // ==========================================

                if (password !== confirmarPassword) {
                    mostrarMensaje("Las contraseñas no coinciden.", "error");

                    return;
                }

                // ==========================================
                // VALIDAR CORREO CORPORATIVO
                // ==========================================

                if (!correo.toLowerCase().endsWith("@cerescos.com")) {
                    mostrarMensaje("Debe utilizar un correo corporativo @cerescos.com.", "error");

                    return;
                }

                // ==========================================
                // VALIDAR CAMPOS
                // ==========================================

                if (!nombre || !apellido || !correo || !usuario || !password) {
                    mostrarMensaje("Todos los campos son obligatorios.", "error");

                    return;
                }

                // ==========================================
                // ENVIAR AL BACKEND
                // ==========================================

                try {
                    const respuesta = await fetch("/api/auth/registrar", {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                        },

                        body: JSON.stringify({
                            nombre: nombre,

                            apellido: apellido,

                            correo: correo,

                            usuarioNombre: usuario,

                            password: password,
                        }),
                    });

                    // ==========================================
                    // LEER RESPUESTA
                    // ==========================================

                    const datos = await respuesta.json();

                    console.log("Respuesta del servidor:", datos);

                    // ==========================================
                    // REGISTRO EXITOSO
                    // ==========================================

                    if (respuesta.ok) {
                        mostrarMensaje(
                            datos.mensaje || "Usuario registrado correctamente.",
                            "exito",
                        );

                        formulario.reset();

                        // Después de 1.8 segundos
                        // regresar al login

                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 1800);
                    }

                    // ==========================================
                    // ERROR DEL SERVIDOR
                    // ==========================================
                    else {
                        let mensajeError = datos.mensaje || "No fue posible registrar el usuario.";

                        // ==========================================
                        // MOSTRAR DETALLE SQL
                        // ==========================================

                        if (datos.detalle) {
                            mensajeError += "<br><br><strong>Detalle:</strong><br>" + datos.detalle;
                        }

                        mostrarMensajeHTML(mensajeError, "error");
                    }
                } catch (error) {
                    // ==========================================
                    // ERROR DE CONEXIÓN
                    // ==========================================

                    console.error("Error:", error);

                    mostrarMensaje("No fue posible conectar con el servidor.", "error");
                }
            });

            // ==========================================
            // MOSTRAR MENSAJE NORMAL
            // ==========================================

            function mostrarMensaje(texto, tipo) {
                mensaje.textContent = texto;

                mensaje.className = "mensaje " + tipo;
            }

            // ==========================================
            // MOSTRAR MENSAJE CON HTML
            // ==========================================

            function mostrarMensajeHTML(contenido, tipo) {
                mensaje.innerHTML = contenido;

                mensaje.className = "mensaje " + tipo;
            }
        </script>
    </body>
</html>
